name: BioForgeStudio
options:
  bundleIdPrefix: ai.bioforge
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  BioForgeStudio:
    type: application
    platform: iOS
    sources:
      - path: BioForgeStudio
        excludes:
          - Info.plist
      - path: www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.bioforge.studio
        PRODUCT_NAME: BioForgeStudio
        INFOPLIST_FILE: BioForgeStudio/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "3.2.2"
        CURRENT_PROJECT_VERSION: "8"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  BioForgeStudio:
    build:
      targets:
        BioForgeStudio: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
